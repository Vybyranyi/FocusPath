<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>FocusPath — habit tracker</title>
    <meta name="description" content="Track the habits you are building and the ones you are quitting, one day at a time." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG, not the SVG it replaces: iOS ignores an SVG touch icon and puts a
         screenshot of the page on the home screen instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FocusPath" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The app ships both themes, so let the browser paint its own chrome to
         match instead of assuming light. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F9FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)" />

    <!-- The two faces that carry the first screen. Without these `swap` paints
         it in a fallback and then reflows once Montserrat lands. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/src/assets/fonts/Montserrat-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/src/assets/fonts/Montserrat-Medium.woff2" />
    <!-- Applies the saved theme before the first paint. A classic, blocking
         script on purpose, and a file rather than inline: the CSP refuses
         inline scripts, so the inline version never ran in production. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
